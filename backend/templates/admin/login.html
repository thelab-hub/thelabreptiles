<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | The Lab Reptiles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'bacon-red': '#ff002b',
                        'bacon-orange': '#ff9100',
                        'dark': '#0a0a0a',
                        'dark-card': '#111111',
                        'dark-border': '#222222'
                    }
                }
            }
        }
    </script>
    <style>
        .bacon-gradient {
            background: linear-gradient(135deg, #ff002b, #ff9100);
        }
        .bacon-text {
            background: linear-gradient(135deg, #ff002b, #ff9100);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="bg-dark text-white min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md px-4">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black">THE LAB <span class="bacon-text">REPTILES</span></h1>
            <p class="text-gray-500 mt-2">Admin Console</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-4 rounded-lg mb-4 {% if category == 'error' %}bg-red-900/50 border border-red-500{% else %}bg-blue-900/50 border border-blue-500{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <div class="bg-dark-card border border-dark-border rounded-xl p-8">
            <h2 class="text-xl font-bold mb-6 text-center">Sign In</h2>

            <form method="POST" action="{{ url_for('admin.login') }}">
                <div class="mb-4">
                    <label for="username" class="block text-sm font-medium text-gray-400 mb-2">Username</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-3 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange text-white">
                </div>

                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange text-white">
                </div>

                <button type="submit"
                        class="w-full py-3 bacon-gradient rounded-lg font-bold text-white hover:opacity-90 transition-opacity">
                    Login
                </button>
            </form>
        </div>

        <p class="text-center text-gray-500 text-sm mt-6">
            <a href="/" class="hover:text-bacon-orange">&larr; Back to Website</a>
        </p>
    </div>
</body>
</html>
