{% extends "admin/base.html" %}

{% block title %}Add Expense{% endblock %}

{% block content %}
<div class="mb-8">
    <a href="{{ url_for('admin.expenses_list') }}" class="text-gray-400 hover:text-white">&larr; Back to Expenses</a>
    <h1 class="text-3xl font-black mt-4">Add New Expense</h1>
</div>

<form method="POST" class="max-w-3xl">
    <div class="bg-dark-card border border-dark-border rounded-xl p-6 mb-6">
        <h2 class="text-lg font-bold mb-4">Expense Details</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm text-gray-400 mb-1">Date *</label>
                <input type="date" name="date" required
                       class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">PO Number</label>
                <input type="text" name="po_number" placeholder="Optional"
                       class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Category *</label>
                <select name="category" required class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
                    <option value="">Select Category</option>
                    <option value="Food & Supplements">Food & Supplements</option>
                    <option value="Enclosures & Racks">Enclosures & Racks</option>
                    <option value="Substrate & Decor">Substrate & Decor</option>
                    <option value="Heating & Lighting">Heating & Lighting</option>
                    <option value="Shipping Supplies">Shipping Supplies</option>
                    <option value="Veterinary">Veterinary</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Software & Subscriptions">Software & Subscriptions</option>
                    <option value="Breeding Stock">Breeding Stock</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Amount ($) *</label>
                <input type="number" name="amount" step="0.01" required placeholder="e.g., 45.99"
                       class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
            </div>

            <div class="md:col-span-2">
                <label class="block text-sm text-gray-400 mb-1">Description *</label>
                <input type="text" name="description" required placeholder="What was purchased?"
                       class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Vendor</label>
                <input type="text" name="vendor" placeholder="Store or seller name"
                       class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Payment Method *</label>
                <select name="payment_method" required class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
                    <option value="">Select Method</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="PayPal">PayPal</option>
                    <option value="E-Transfer">E-Transfer</option>
                    <option value="Cash">Cash</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Tax Deductible</label>
                <select name="tax_deductible" class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
                    <option value="Yes">Yes - Fully Deductible</option>
                    <option value="Partial">Partial</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div>
                <label class="block text-sm text-gray-400 mb-1">Project Allocated</label>
                <select name="project" class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange">
                    <option value="All">All Projects</option>
                    <option value="Bacon Quad Stripe">Bacon Quad Stripe</option>
                    <option value="General Stock">General Stock</option>
                    <option value="Red Line">Red Line</option>
                </select>
            </div>
        </div>
    </div>

    <div class="bg-dark-card border border-dark-border rounded-xl p-6 mb-6">
        <h2 class="text-lg font-bold mb-4">Notes</h2>
        <textarea name="notes" rows="3" placeholder="Any additional notes..."
                  class="w-full px-4 py-2 bg-dark border border-dark-border rounded-lg focus:outline-none focus:border-bacon-orange"></textarea>
    </div>

    <div class="flex gap-4">
        <button type="submit" class="bacon-gradient px-8 py-3 rounded-lg font-bold hover:opacity-90">
            Add Expense
        </button>
        <a href="{{ url_for('admin.expenses_list') }}" class="px-8 py-3 border border-dark-border rounded-lg hover:border-gray-500">Cancel</a>
    </div>
</form>
{% endblock %}
